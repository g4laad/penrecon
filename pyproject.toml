[project]
name = "penrecon"
version = "0.1.0"
description = "Single-user local pentest recon manager: ingest scan output, browse hosts/services, diff scans, annotate findings."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.0",
    "python-libnmap>=0.7.3",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.49.0",
]

[project.scripts]
penrecon = "penrecon.__main__:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
    "jsonschema>=4.23",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy comparisons construct SQL expressions, not Python truth checks.
"src/penrecon/history.py" = ["E712"]
# Projection hooks must be registered after the model tables are defined.
"src/penrecon/models.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["libnmap.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
