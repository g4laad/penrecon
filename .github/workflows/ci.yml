name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Test, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: uv sync --locked --group dev

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Test backend
        run: uv run --locked pytest

      - name: Check Python types
        run: uv run --locked mypy src/penrecon

      - name: Check TypeScript and build frontend
        run: npm --prefix frontend run build

      - name: Build wheel with frontend assets
        run: uv build --wheel

      - name: Smoke-test installed CLI
        run: uv run --isolated --no-project --with dist/penrecon-*.whl penrecon --help
